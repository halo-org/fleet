[package]
name = "fleet-wasm"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
fleet-core.workspace = true
fleet-kit.workspace = true
futures-channel = { workspace = true, features = ["std", "sink"] }
futures-util = { workspace = true, features = ["std", "sink"] }
http = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
wasmtime = { workspace = true, features = ["async", "component-model", "component-model-async", "cranelift", "pooling-allocator", "runtime", "std"] }
wasmtime-wasi = { workspace = true, features = ["p3"] }
wasmtime-wasi-http = { workspace = true, features = ["default-send-request", "p3"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["process", "std"] }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
fleet-store = { workspace = true, features = ["blobs", "roles"] }
tokio = { workspace = true, features = ["rt", "time"] }
wit-component = { version = "0.262.0", default-features = false }
