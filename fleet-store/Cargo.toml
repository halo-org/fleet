[package]
name = "fleet-store"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fleet-core.workspace = true
fleet-kit = { workspace = true, optional = true }
futures-channel = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["std"] }
image = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
redb = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
futures-executor = { workspace = true, features = ["std"] }

[features]
queries = ["dep:fleet-kit"]
blobs = ["dep:fleet-kit", "dep:image", "dep:sha2"]
roles = ["dep:fleet-kit"]
notifications = []
