[package]
name = "fleet-plugin-openai"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true, features = ["std"] }
fleet-core.workspace = true
fleet-kit.workspace = true
fleet-models.workspace = true
futures-util = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
wit-bindgen = { workspace = true, features = ["async", "async-spawn", "macros", "realloc", "std"] }
