[workspace]
resolver = "3"
members = ["fleet", "fleet-core", "fleet-kit", "fleet-models", "fleet-plugin-host", "fleet-plugin-openai", "fleet-plugin-sprites", "fleet-plugin-tools", "fleet-simulator", "fleet-store", "fleet-wasm", "fleet-wasm/tests/worker"]

[workspace.package]
edition = "2024"
license = "0BSD"
repository = "https://github.com/halo-org/fleet"
rust-version = "1.98"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_panics_doc = "allow"
multiple_crate_versions = "allow"

alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
cfg_not_test = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
doc_paragraphs_missing_punctuation = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
field_scoped_visibility_modifiers = "warn"
float_cmp_const = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
integer_division = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
precedence_bits = "warn"
pub_without_shorthand = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_inside_block = "warn"
std_instead_of_core = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_debug = "warn"

[workspace.dependencies]
fleet-core.path = "fleet-core"
fleet-kit.path = "fleet-kit"
fleet-models.path = "fleet-models"
fleet-simulator.path = "fleet-simulator"
fleet-store.path = "fleet-store"
fleet-wasm.path = "fleet-wasm"

base64 = { version = "0.23.1", default-features = false }
bytes = { version = "1.12.1", default-features = false }
fastrand = { version = "2.5.0", default-features = false }
form_urlencoded = { version = "1.2.2", default-features = false }
futures-channel = { version = "0.3.34", default-features = false }
futures-executor = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
http = { version = "1.5.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
percent-encoding = { version = "2.3.2", default-features = false }
redb = { version = "4.4.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rustix = { version = "1.1.6", default-features = false }
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
sse-stream = { version = "0.2.5", default-features = false }
tokio = { version = "1.54.0", default-features = false }
url = { version = "2.5.8", default-features = false }
wasmtime = { version = "50.0.1", default-features = false }
wasmtime-wasi = { version = "50.0.1", default-features = false }
wasmtime-wasi-http = { version = "50.0.1", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
wit-bindgen = { version = "0.63.0", default-features = false }
yaml_serde = { version = "0.10.7", default-features = false }
